spring.application.name=questionario-backend
server.port=${SERVER_PORT:8082}
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Capa do questionário (o município só lê; para mudar, altere aqui ou na variável de ambiente e reinicie).
# Datas no formato AAAA-MM-DD; vazio = "a definir".
# Em branco = titulo padrao do documento (definido em LevantamentoProperties). Arquivos .properties devem ficar
# so com ASCII: o Spring Boot os le como ISO-8859-1 e acentos viram lixo. Use \u00e1 (e similares) se precisar.
app.levantamento.titulo=${LEVANTAMENTO_TITULO:}
app.levantamento.periodo-referencia-inicio=${LEVANTAMENTO_PERIODO_INICIO:}
app.levantamento.periodo-referencia-fim=${LEVANTAMENTO_PERIODO_FIM:}
app.levantamento.data-censo-upa=${LEVANTAMENTO_DATA_CENSO:}
app.levantamento.prazo-devolucao=${LEVANTAMENTO_PRAZO_DEVOLUCAO:}
app.levantamento.enviar-para=${LEVANTAMENTO_ENVIAR_PARA:}
