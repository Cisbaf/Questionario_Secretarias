# Mesmo MySQL do docker-compose da raiz do IdeaProjects (porta 3307); o banco "questionario" é criado se não existir.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME:questionario}?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3002}

# Admin de desenvolvimento (so local): troque por variaveis de ambiente fora do seu computador.
app.admin.email=${ADMIN_EMAIL:admin@cisbaf.local}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.jwt-secret=${JWT_SECRET:segredo-so-para-desenvolvimento-local-0123456789}
