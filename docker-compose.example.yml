
services:
  backend:
    image: gustavoffonseca/questionario_secretarias:back
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}/${DB_NAME:-questionario}?serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SEGURO: ${COOKIE_SEGURO:-true}
      LEVANTAMENTO_TITULO: ${LEVANTAMENTO_TITULO:-}
      LEVANTAMENTO_PERIODO_INICIO: ${LEVANTAMENTO_PERIODO_INICIO:-}
      LEVANTAMENTO_PERIODO_FIM: ${LEVANTAMENTO_PERIODO_FIM:-}
      LEVANTAMENTO_DATA_CENSO: ${LEVANTAMENTO_DATA_CENSO:-}
      LEVANTAMENTO_PRAZO_DEVOLUCAO: ${LEVANTAMENTO_PRAZO_DEVOLUCAO:-}
      LEVANTAMENTO_ENVIAR_PARA: ${LEVANTAMENTO_ENVIAR_PARA:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8082"

  frontend:
    image: gustavoffonseca/questionario_secretarias:front
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend:8082/api
    ports:
      - "${FRONT_PORT:-3002}:3002"
